name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      # the store tests need a real server; without this they skip instead of running
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: The suite must pass with no model key and no embedding model
        run: pytest -q
      - name: The command line must come up
        run: |
          mh --help > /dev/null
          python -c "import mh.web.app as app; print(app.HOST, app.PORT)"
